<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>c0tter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
<!-- PostHog analytics: cookieless (no consent banner needed), no session recording -->
<script src="https://eu-assets.i.posthog.com/static/array.js"></script>
<script>
  posthog.init('phc_xgSfFY4pe349gr9sBGHhFwFsVn7AQdGN5cNiqNkg5s4K', {
    api_host: 'https://eu.i.posthog.com',
    persistence: 'memory',
    respect_dnt: true,
    disable_session_recording: true
  });
</script>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;
const PARTICLE_COUNT = 120;
const particles = [];
let mouse = { x: -9999, y: -9999 };
let frame = 0;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}

class Particle {
  constructor() { this.reset(true); }
  reset(initial) {
    this.angle  = Math.random() * Math.PI * 2;
    this.radius = initial ? Math.random() * Math.max(W, H) * 0.6 : 0;
    this.targetR = Math.random() * Math.max(W, H) * 0.55 + 40;
    this.speed  = (Math.random() * 0.0003 + 0.0001) * (Math.random() < 0.5 ? 1 : -1);
    this.drift  = (Math.random() - 0.5) * 0.0008;
    this.size   = Math.random() * 2 + 0.5;
    this.baseAlpha = Math.random() * 0.5 + 0.3;
    this.alpha  = this.baseAlpha;
    this.hue    = Math.random() < 0.25 ? 42 : 210 + Math.random() * 40;
    this.sat    = this.hue < 80 ? 100 : 60 + Math.random() * 30;
    this.life   = 0;
    this.maxLife = 400 + Math.random() * 600;
  }
  update() {
    this.angle  += this.speed + Math.sin(frame * 0.002 + this.angle) * this.drift;
    this.radius += (this.targetR - this.radius) * 0.005;
    this.life++;
    const t = this.life / this.maxLife;
    this.alpha = this.baseAlpha * Math.sin(t * Math.PI);
    this.x = cx + Math.cos(this.angle) * this.radius;
    this.y = cy + Math.sin(this.angle) * this.radius;
    // mouse repulsion
    const dx = this.x - mouse.x, dy = this.y - mouse.y;
    const d  = Math.sqrt(dx*dx + dy*dy);
    if (d < 120) {
      const force = (120 - d) / 120;
      this.x += (dx / d) * force * 3;
      this.y += (dy / d) * force * 3;
    }
    if (this.life >= this.maxLife) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue},${this.sat}%,75%,${this.alpha})`;
    ctx.fill();
  }
}

function initParticles() {
  particles.length = 0;
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
}

function drawConnections() {
  const LINK_DIST = 100;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < LINK_DIST) {
        const alpha = (1 - d / LINK_DIST) * Math.min(a.alpha, b.alpha) * 0.4;
        const hue   = (a.hue + b.hue) / 2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `hsla(${hue},70%,70%,${alpha})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }
  }
}

function drawCore() {
  const pulse = 0.85 + Math.sin(frame * 0.025) * 0.15;
  // outer glow
  const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 180 * pulse);
  g1.addColorStop(0,   'hsla(210,80%,60%,0.18)');
  g1.addColorStop(0.5, 'hsla(220,70%,50%,0.08)');
  g1.addColorStop(1,   'hsla(220,60%,40%,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 180 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = g1;
  ctx.fill();
  // inner core
  const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 24 * pulse);
  g2.addColorStop(0,   'hsla(42,100%,80%,0.9)');
  g2.addColorStop(0.4, 'hsla(42,100%,65%,0.5)');
  g2.addColorStop(1,   'hsla(42,80%,50%,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 24 * pulse, 0, Math.PI * 2);
  ctx.fillStyle = g2;
  ctx.fill();
}

function loop() {
  frame++;
  // fade trail
  ctx.fillStyle = 'rgba(0,0,4,0.18)';
  ctx.fillRect(0, 0, W, H);

  drawConnections();
  particles.forEach(p => { p.update(); p.draw(); });
  drawCore();

  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { resize(); initParticles(); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

resize();
initParticles();
loop();
</script>
</body>
</html>
